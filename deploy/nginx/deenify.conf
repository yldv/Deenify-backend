# /etc/nginx/sites-available/deenify
# API + admin: api.frienfinity.uz
#
# If HTTPS shows the wrong certificate (e.g. vt-travel.uz), this file was missing
# a listen 443 ssl block — nginx fell back to another site's default_server.
#
# Install:
#   sudo cp deploy/nginx/deenify.conf /etc/nginx/sites-available/deenify
#   sudo ln -sf /etc/nginx/sites-available/deenify /etc/nginx/sites-enabled/deenify
#   sudo certbot certonly --nginx -d api.frienfinity.uz   # first time only
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.frienfinity.uz;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/deenify;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.frienfinity.uz;

    ssl_certificate /etc/letsencrypt/live/api.frienfinity.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.frienfinity.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/deenify/staticfiles/;
    }

    # Production: checkout.pays.uz (sandbox: atmos-checkout-proxy.conf → test-checkout.pays.uz)
    include /etc/nginx/snippets/atmos-checkout-proxy.prod.conf;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }
}
