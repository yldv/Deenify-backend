# Atmos sandbox: dev-checkout.atmos.uz accepts only whitelisted server IP.
# Include inside server { } for api.frienfinity.uz (HTTPS block).
#
# GET  /invoice?id=...  -> checkout HTML
# POST /invoice?id=...  -> Next.js Server Action (card validation) — must not return 500

location ~ ^/(invoice|_next|manifest\.json|favicon\.ico|icon\.svg|apple-icon\.png) {
    proxy_pass https://dev-checkout.atmos.uz;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;

    # Backend must see itself as dev-checkout, not api.frienfinity.uz
    proxy_set_header Host dev-checkout.atmos.uz;
    proxy_set_header X-Forwarded-Host dev-checkout.atmos.uz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 10M;
}
