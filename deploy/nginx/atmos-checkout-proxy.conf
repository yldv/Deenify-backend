# Atmos sandbox checkout via api.frienfinity.uz (HTTPS for Telegram).
# Include inside server { } for api.frienfinity.uz (HTTPS block).
#
# merchant/pay:  GET /invoice/get?storeId=...&transactionId=...
# invoice flow:  GET /invoice?id=...  and POST /invoice (card validation)

location ~ ^/(invoice/get|invoice|_next|manifest\.json|favicon\.ico|icon\.svg|apple-icon\.png) {
    proxy_pass https://dev-checkout.atmos.uz;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;

    proxy_set_header Host dev-checkout.atmos.uz;
    proxy_set_header X-Forwarded-Host dev-checkout.atmos.uz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 10M;
}
