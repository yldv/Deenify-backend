# Atmos merchant sandbox checkout via api.frienfinity.uz (HTTPS for Telegram).
# Flow: POST apigw.atmos.uz/merchant/pay/create → test-checkout.pays.uz/invoice/get
# Include inside server { } for api.frienfinity.uz (HTTPS block).

location ~ ^/(invoice/get|_next|manifest\.json|favicon\.ico|icon\.svg|apple-icon\.png) {
    proxy_pass https://test-checkout.pays.uz;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;

    proxy_set_header Host test-checkout.pays.uz;
    proxy_set_header X-Forwarded-Host test-checkout.pays.uz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 10M;
}
