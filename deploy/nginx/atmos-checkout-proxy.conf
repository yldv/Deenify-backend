# Atmos sandbox: dev-checkout.atmos.uz accepts only whitelisted server IP.
# Include this file inside server { } for api.frienfinity.uz (HTTP and HTTPS blocks).
#
# User opens:  https://api.frienfinity.uz/invoice?id=...
# Nginx proxies to dev-checkout.atmos.uz from 157.173.124.191

location ~ ^/(invoice|_next|manifest\.json|favicon\.ico|icon\.svg|apple-icon\.png) {
    proxy_pass https://dev-checkout.atmos.uz;
    proxy_set_header Host dev-checkout.atmos.uz;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
