<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="6;url={{ bot_url }}">
  <title>Deenify — To'lov natijasi</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f4; color: #14251a; }
    main { width: min(100%, 440px); margin: 20px; padding: 30px 24px; border-radius: 20px; background: #fff; box-shadow: 0 12px 36px #17351b1a; text-align: center; }
    .brand { color: #159947; font-weight: 800; font-size: 27px; letter-spacing: -.5px; }
    h1 { margin: 22px 0 8px; font-size: 22px; }
    p { color: #536158; line-height: 1.55; }
    .icon { font-size: 46px; line-height: 1; }
    a.button { display: block; margin-top: 22px; padding: 15px; border-radius: 12px; background: #159947; color: #fff; text-decoration: none; font-weight: 700; }
    .back { display: inline-block; margin-top: 18px; color: #158543; font-size: 14px; text-decoration: none; }
    .order { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #97a29a; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
  <div class="brand">Deenify</div>
  <div class="icon">✅</div>
  <h1>To'lovni tekshirmoqdamiz</h1>
  <p>Click to'lovni tasdiqladi. Premium obuna bir necha soniya ichida faollashtiriladi —
     aniq holatni botdagi profil bo'limida ko'rasiz.</p>
  <a class="button" href="{{ bot_url }}">Botga qaytish</a>
    {% if service_id %}
      <div class="order">Click service_id: {{ service_id }} · merchant_id: {{ merchant_id }}</div>
    {% endif %}
  </main>
</body>
</html>
