<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deenify — To'lov</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }
    #parent-frame {
      min-height: 70vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    .hint {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 12px;
    }
    .error {
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
      background: #fff3f3;
      border-radius: 12px;
      color: #8a1f1f;
      line-height: 1.5;
    }
  </style>
  {% if checkout_key %}
  <script src="{{ checkout_js_url }}"></script>
  {% endif %}
</head>
<body>
  {% if checkout_key %}
  <div id="parent-frame"></div>
  <p class="hint">To'lov formasi yuklanmoqda…</p>
  <script>
    paymo_open_widget({
      parent_id: "parent-frame",
      store_id: {{ store_id }},
      account: "{{ account|escapejs }}",
      {% if terminal_id %}terminal_id: {{ terminal_id }},{% endif %}
      success_redirect: "{{ success_redirect|escapejs }}",
      fail_redirect: "{{ fail_redirect|escapejs }}",
      version: "1.0.0",
      amount: {{ amount }},
      lang: "{{ lang }}",
      key: "{{ checkout_key|escapejs }}",
      theme: "blue"
    });
  </script>
  {% else %}
  <div class="error">
    <strong>To'lov sozlanmagan.</strong><br>
    Serverda <code>ATMOS_CHECKOUT_KEY</code> yoki <code>ATMOS_API_KEY</code> yo'q.
    Kalitni <a href="https://partner-test.atmos.uz">partner-test.atmos.uz</a> kabinetidan oling.
  </div>
  {% endif %}
</body>
</html>
