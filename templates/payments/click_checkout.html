<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deenify — Click to'lovi</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f4; color: #14251a; }
    main { box-sizing: border-box; width: min(100%, 440px); margin: 20px; padding: 30px 24px; border-radius: 20px; background: #fff; box-shadow: 0 12px 36px #17351b1a; text-align: center; }
    .brand { color: #159947; font-weight: 800; font-size: 27px; letter-spacing: -.5px; }
    h1 { margin: 22px 0 8px; font-size: 22px; }
    p { color: #536158; line-height: 1.55; }
    .amount { margin: 24px 0; padding: 17px; border-radius: 14px; background: #f1f9f3; font-size: 24px; font-weight: 750; }
    .plan { font-size: 14px; color: #68756c; margin-bottom: 4px; }
    a.button { display: block; padding: 15px; border-radius: 12px; background: #159947; color: #fff; text-decoration: none; font-weight: 700; }
    .back { display: inline-block; margin-top: 18px; color: #158543; font-size: 14px; text-decoration: none; }
    .error { color: #a12525; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Deenify</div>
    {% if error %}
      <h1>To'lovni ochib bo'lmadi</h1>
      <p class="error">{{ error }}</p>
      <a class="back" href="{{ bot_url|default:'https://t.me/DeenifyUzBot' }}">Botga qaytish</a>
    {% else %}
      <h1>Obunani faollashtirish</h1>
      <p class="plan">{{ plan_name }}</p>
      <div class="amount">{{ amount }} {{ currency }}</div>
      <p>To'lov Clickning xavfsiz sahifasida amalga oshiriladi.</p>
      <a class="button" href="{{ payment_url }}">Click orqali to'lash</a>
      <a class="back" href="{{ bot_url }}">Botga qaytish</a>
    {% endif %}
  </main>
</body>
</html>
